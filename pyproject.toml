[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mimickit-smp"
version = "0.1.0"
description = "Portable robot-object motion data and features for SMP"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.0"]

[project.optional-dependencies]
prepare = ["scipy>=1.10", "mujoco>=3.0"]
test = ["pytest>=7", "scipy>=1.10", "mujoco>=3.0"]

[tool.setuptools.packages.find]
include = ["mimickit_smp*"]

[tool.pytest.ini_options]
testpaths = ["tests/smp_reward"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

