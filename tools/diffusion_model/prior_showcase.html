<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>__TITLE__</title>
<style>
body { font-family: -apple-system, system-ui, sans-serif; max-width: 1180px; margin: 24px auto; padding: 0 16px; color: #222; }
h1 { font-size: 1.5em; margin-bottom: 0.2em; }
h2 { font-size: 1.2em; margin-top: 1.6em; }
.generated { color: #666; font-size: 0.85em; margin-top: 0; }
table { border-collapse: collapse; margin: 8px 0 16px; }
th, td { border: 1px solid #ddd; padding: 5px 10px; text-align: left; font-size: 0.92em; }
thead th { background: #f4f4f4; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
.note { color: #555; font-size: 0.9em; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid #ccc; margin-top: 1.4em; }
.tabs button { border: 1px solid #ccc; border-bottom: none; background: #f6f6f6; padding: 7px 16px; font-size: 0.95em;
  border-radius: 6px 6px 0 0; cursor: pointer; }
.tabs button.active { background: #fff; font-weight: 600; position: relative; top: 1px; }
#stage { position: relative; height: 680px; border: 1px solid #ccc; border-top: none; background: #f3f5f4; }
#stage iframe { border: 0; width: 100%; height: 100%; display: block; background: white; }
#stage:fullscreen { height: 100vh; width: 100vw; }
.toolbar { display: flex; justify-content: space-between; align-items: baseline; margin: 6px 0 0; }
.toolbar button { font-size: 0.85em; padding: 3px 10px; cursor: pointer; }
.legend span { display: inline-block; margin-right: 14px; font-size: 0.9em; }
.swatch { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
</style>
</head>
<body>
<h1>__TITLE__</h1>
<p class="generated">Generated __GENERATED_UTC__ · offline Viser replays, no server needed</p>
__NOTES__
<h2>Generated windows</h2>
<p class="legend">__LEGEND__</p>
<div class="tabs" id="tabs"></div>
<div id="stage"></div>
<div class="toolbar"><span class="note" id="caption"></span><button id="fullscreen">Fullscreen</button></div>
<script type="application/json" id="showcase-data">__DATA__</script>
<script>
const data = JSON.parse(document.getElementById('showcase-data').textContent);
const client = new TextDecoder().decode(Uint8Array.from(atob(data.client), c => c.charCodeAt(0)));
const tabs = document.getElementById('tabs');
function show(id) {
  const s = data.scenes.find(s => s.id === id);
  if (!s) return;
  for (const b of tabs.children) b.classList.toggle('active', b.dataset.id === id);
  const stage = document.getElementById('stage');
  stage.replaceChildren();  // One live player at a time keeps memory low.
  const frame = document.createElement('iframe');
  frame.title = s.title + ' — Viser replay';
  frame.setAttribute('allowfullscreen', '');
  frame.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-downloads allow-pointer-lock');
  const inject = '<script>window.__VISER_EMBED_DATA__=' + JSON.stringify(s.scene) +
    ';window.__VISER_EMBED_CONFIG__={darkMode:false};<' + '/script>';
  frame.srcdoc = client.replace('</head>', inject + '</head>');
  stage.append(frame);
  document.getElementById('caption').innerHTML = s.caption;
  history.replaceState(null, '', '#' + id);
}
for (const s of data.scenes) {
  const b = document.createElement('button');
  b.dataset.id = s.id;
  b.textContent = s.title;
  b.onclick = () => show(s.id);
  tabs.append(b);
}
document.getElementById('fullscreen').onclick = () => document.getElementById('stage').requestFullscreen();
const initial = location.hash.slice(1);
show(data.scenes.some(s => s.id === initial) ? initial : data.scenes[0].id);
</script>
</body>
</html>
